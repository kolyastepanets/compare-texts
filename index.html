<body>
  <div class="wrapper">
    <main role="main">
      <div class="container">
        <h1 class="compare-texts">Compare Texts</h1>
    <div class="button-container">
      <button onclick="compareTexts()" aria-label="Compare the two text versions">Compare</button>
    </div>
    <div id="message-div"></div>
    <div class="text-container">
      <div id="text1" class="editable" contenteditable="true" data-placeholder-1="Insert a version of the text here."></div>
      <a id="arrow-down" class="arrow-down">&#x2193;</a>
      <div id="text2" class="editable" contenteditable="true" data-placeholder-2="Insert another version of the text here."></div>
    </div>
    <div id="original-texts-container" class="original-texts-container" style="display: none;">
      <textarea id="original-text1" class="original-text"></textarea>
      <div class="spacer"></div>
      <textarea id="original-text2" class="original-text"></textarea>
    </div>
    <div class="bottom-buttons">
      <button id="clear-all-btn" onclick="clearAll()" style="display: none;">Clear All</button>
    </div>
  </div>

  <script>
    ['text1', 'text2'].forEach(function(id) {
      var editable = document.getElementById(id);
      editable.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        // execCommand('insertText') runs large pastes through the editing/undo
        // pipeline and can freeze the tab; insert a single text node instead.
        var selection = window.getSelection();
        if (selection.rangeCount > 0 && editable.contains(selection.anchorNode)) {
          var range = selection.getRangeAt(0);
          range.deleteContents();
          var node = document.createTextNode(text);
          range.insertNode(node);
          range.setStartAfter(node);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
        } else {
          editable.appendChild(document.createTextNode(text));
        }
      });
    });

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function highlightDifferences(line1, line2) {
      function findLCS(s1, s2) {
        const lengths = Array(s1.length + 1).fill(null).map(() => Array(s2.length + 1).fill(0));
        for (let i = 1; i <= s1.length; i++) {
          for (let j = 1; j <= s2.length; j++) {
            if (s1[i - 1] === s2[j - 1]) {
              lengths[i][j] = lengths[i - 1][j - 1] + 1;
            } else {
              lengths[i][j] = Math.max(lengths[i - 1][j], lengths[i][j - 1]);
            }
          }
        }
        let lcs = '';
        let x = s1.length;
        let y = s2.length;
        while (x !== 0 && y !== 0) {
          if (lengths[x][y] === lengths[x - 1][y]) {
            x--;
          } else if (lengths[x][y] === lengths[x][y - 1]) {
            y--;
          } else {
            lcs = s1[x - 1] + lcs;
            x--;
            y--;
          }
        }
        return lcs;
      }

      // Trim the common prefix/suffix so the O(n*m) LCS only runs on the
      // changed core of the line, not the whole line.
      let prefix = 0;
      const minLength = Math.min(line1.length, line2.length);
      while (prefix < minLength && line1[prefix] === line2[prefix]) prefix++;
      let end1 = line1.length;
      let end2 = line2.length;
      while (end1 > prefix && end2 > prefix && line1[end1 - 1] === line2[end2 - 1]) {
        end1--;
        end2--;
      }
      const core1 = line1.slice(prefix, end1);
      const core2 = line2.slice(prefix, end2);
      const head = escapeHtml(line1.slice(0, prefix));
      const tail = escapeHtml(line1.slice(end1));

      // The changed region is too large for a character-level diff —
      // highlight it as a whole instead of freezing the tab.
      if (core1.length * core2.length > 1000000) {
        const wrap = (core) => core ? `<span class="highlight">${escapeHtml(core)}</span>` : '';
        return {
          highlightedLine1: head + wrap(core1) + tail,
          highlightedLine2: head + wrap(core2) + tail
        };
      }

      const lcs = findLCS(core1, core2);
      let highlightedLine1 = head;
      let highlightedLine2 = head;
      let run1 = '';
      let run2 = '';
      let i = 0, j = 0, k = 0;

      // Buffer consecutive changed characters so each run becomes one span
      // instead of a span per character.
      function flushRuns() {
        if (run1) {
          highlightedLine1 += `<span class="highlight">${escapeHtml(run1)}</span>`;
          run1 = '';
        }
        if (run2) {
          highlightedLine2 += `<span class="highlight">${escapeHtml(run2)}</span>`;
          run2 = '';
        }
      }

      while (i < core1.length || j < core2.length) {
        if (k < lcs.length && core1[i] === lcs[k] && core2[j] === lcs[k]) {
          flushRuns();
          highlightedLine1 += escapeHtml(core1[i]);
          highlightedLine2 += escapeHtml(core2[j]);
          i++;
          j++;
          k++;
        } else {
          if (i < core1.length && (k >= lcs.length || core1[i] !== lcs[k])) {
            run1 += core1[i];
            i++;
          }
          if (j < core2.length && (k >= lcs.length || core2[j] !== lcs[k])) {
            run2 += core2[j];
            j++;
          }
        }
      }
      flushRuns();

      return {
        highlightedLine1: highlightedLine1 + tail,
        highlightedLine2: highlightedLine2 + tail
      };
    }

    function compareTexts() {
      const text1Div = document.getElementById('text1');
      const text2Div = document.getElementById('text2');
      const messageDiv = document.getElementById('message-div');
      const originalText1Input = document.getElementById('original-text1');
      const originalText2Input = document.getElementById('original-text2');

      const text1 = originalText1Input.value || text1Div.innerText;
      const text2 = originalText2Input.value || text2Div.innerText;
      messageDiv.textContent = ''; // Clear previous messages

      // Do nothing if both texts are empty
      if (!text1.trim() && !text2.trim()) {
        return;
      }

      if (!originalText1Input.value) {
        originalText1Input.value = text1;
      }
      if (!originalText2Input.value) {
        originalText2Input.value = text2;
      }
      document.getElementById('original-texts-container').style.display = 'flex';

      const lines1 = text1.split('\n');
      const lines2 = text2.split('\n');
      const newLines1 = [];
      const newLines2 = [];

      let highlightedText1 = '';
      let highlightedText2 = '';
      let isDifferent = false;
      let firstDifferenceLine = null;

      // Align lines using edit distance to keep substitutions on the same line.
      function alignLines(fullA, fullB) {
        // Trim common prefix/suffix lines first — the DP below is
        // O(a.length * b.length) in time and memory.
        let prefix = 0;
        const minLength = Math.min(fullA.length, fullB.length);
        while (prefix < minLength && fullA[prefix] === fullB[prefix]) prefix++;
        let endA = fullA.length;
        let endB = fullB.length;
        while (endA > prefix && endB > prefix && fullA[endA - 1] === fullB[endB - 1]) {
          endA--;
          endB--;
        }
        const a = fullA.slice(prefix, endA);
        const b = fullB.slice(prefix, endB);

        // Too many changed lines to align optimally — pair them up as-is
        // instead of building a huge DP matrix.
        if (a.length * b.length > 4000000) {
          const coreLength = Math.max(a.length, b.length);
          const pairedA = [];
          const pairedB = [];
          for (let i = 0; i < coreLength; i++) {
            pairedA.push(i < a.length ? a[i] : '');
            pairedB.push(i < b.length ? b[i] : '');
          }
          return {
            alignedA: fullA.slice(0, prefix).concat(pairedA, fullA.slice(endA)),
            alignedB: fullB.slice(0, prefix).concat(pairedB, fullB.slice(endB))
          };
        }

        const rows = a.length + 1;
        const cols = b.length + 1;
        const dp = Array(rows)
          .fill(null)
          .map(() => Array(cols).fill(0));

        for (let i = 0; i < rows; i++) {
          dp[i][0] = i;
        }
        for (let j = 0; j < cols; j++) {
          dp[0][j] = j;
        }

        for (let i = 1; i < rows; i++) {
          for (let j = 1; j < cols; j++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            dp[i][j] = Math.min(
              dp[i - 1][j] + 1, // delete
              dp[i][j - 1] + 1, // insert
              dp[i - 1][j - 1] + cost // substitute/match
            );
          }
        }

        const alignedA = [];
        const alignedB = [];
        let i = a.length;
        let j = b.length;

        while (i > 0 || j > 0) {
          if (i > 0 && j > 0) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            if (dp[i][j] === dp[i - 1][j - 1] + cost) {
              alignedA.push(a[i - 1]);
              alignedB.push(b[j - 1]);
              i--;
              j--;
              continue;
            }
          }
          if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) {
            alignedA.push(a[i - 1]);
            alignedB.push('');
            i--;
          } else {
            alignedA.push('');
            alignedB.push(b[j - 1]);
            j--;
          }
        }

        alignedA.reverse();
        alignedB.reverse();
        return {
          alignedA: fullA.slice(0, prefix).concat(alignedA, fullA.slice(endA)),
          alignedB: fullB.slice(0, prefix).concat(alignedB, fullB.slice(endB))
        };
      }

      const aligned = alignLines(lines1, lines2);
      const alignedLength = Math.max(aligned.alignedA.length, aligned.alignedB.length);
      for (let i = 0; i < alignedLength; i++) {
        newLines1.push(aligned.alignedA[i] || '');
        newLines2.push(aligned.alignedB[i] || '');
      }

      for (let i = 0; i < alignedLength; i++) {
        const line1 = newLines1[i] || '';
        const line2 = newLines2[i] || '';
        const lineNumber = i + 1; // Line number starts from 1

        if (line1 !== line2) {
          isDifferent = true;
          if (firstDifferenceLine === null) {
            firstDifferenceLine = lineNumber;
          }
          const { highlightedLine1, highlightedLine2 } = highlightDifferences(line1, line2);
          highlightedText1 += `<span id="line-left-${lineNumber}" class="highlight">${lineNumber}</span>` + ': ';
          highlightedText1 += `<span> ${highlightedLine1 + '\n'}</span>`
          highlightedText2 += `<span id="line-right-${lineNumber}" class="highlight">${lineNumber}</span>` + ': ';
          highlightedText2 += `<span> ${highlightedLine2 + '\n'}</span>`
        } else {
          highlightedText1 += lineNumber + ': ' + escapeHtml(line1) + '\n';
          highlightedText2 += lineNumber + ': ' + escapeHtml(line2) + '\n';
        }
      }

      text1Div.innerHTML = highlightedText1.replace(/\n/g, '<br>');
      text2Div.innerHTML = highlightedText2.replace(/\n/g, '<br>');

      text1Div.style.height = text1Div.scrollHeight + 'px';
      text2Div.style.height = text2Div.scrollHeight + 'px';

      text1Div.contentEditable = 'false';
      text2Div.contentEditable = 'false';

      if (isDifferent) {
        const arrowDown = document.getElementById('arrow-down');
        arrowDown.style.color = '#4141c9'; // Show the arrow
        // Assign (not addEventListener) so repeated comparisons don't stack
        // listeners pointing at stale line numbers.
        arrowDown.onclick = function() {
          const firstDifferenceElement = document.getElementById(`line-left-${firstDifferenceLine}`);
          if (firstDifferenceElement) {
            firstDifferenceElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };
      } else {
        messageDiv.textContent = 'The texts are the same.';
      }

      // Show Clear All button after comparison
      document.getElementById('clear-all-btn').style.display = 'block';
    }

    function clearAll() {
      const text1Div = document.getElementById('text1');
      const text2Div = document.getElementById('text2');
      const messageDiv = document.getElementById('message-div');
      const originalText1Input = document.getElementById('original-text1');
      const originalText2Input = document.getElementById('original-text2');
      const arrowDown = document.getElementById('arrow-down');

      // Clear text fields
      text1Div.innerHTML = '';
      text2Div.innerHTML = '';

      // Clear original texts
      originalText1Input.value = '';
      originalText2Input.value = '';

      // Clear message
      messageDiv.textContent = '';

      // Hide original texts container
      document.getElementById('original-texts-container').style.display = 'none';

      // Reset contentEditable
      text1Div.contentEditable = 'true';
      text2Div.contentEditable = 'true';

      // Reset height
      text1Div.style.height = '';
      text2Div.style.height = '';

      // Reset arrow color and detach the jump handler
      arrowDown.style.color = '';
      arrowDown.onclick = null;

      // Hide Clear All button
      document.getElementById('clear-all-btn').style.display = 'none';
    }
  </script>
